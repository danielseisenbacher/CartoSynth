<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- System fonts + the fonts of the mounted repository (see cartosynth/fonts.py). -->
<fontconfig>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/workspace/data/fonts/build</dir>
  <dir>/workspace/data/fonts/files</dir>
</fontconfig>
